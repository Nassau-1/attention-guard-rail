name: FocusHome
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages: {}
targets:
  FocusHome:
    type: application
    platform: iOS
    sources:
      - Sources/FocusHomeApp
    entitlements:
      path: Sources/FocusHomeApp/FocusHome.entitlements
    info:
      path: Sources/FocusHomeApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.focushome
    dependencies:
      - target: FocusHomeWidgets
      - target: FocusShieldActionExtension
      - target: FocusShieldConfigurationExtension
      - target: FocusDeviceActivityMonitorExtension

  FocusHomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusHomeWidgets
    entitlements:
      path: Sources/FocusHomeWidgets/FocusHomeWidgets.entitlements
    info:
      path: Sources/FocusHomeWidgets/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.focushome.widgets

  FocusShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusShieldActionExtension
    info:
      path: Sources/FocusShieldActionExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.focushome.shield-action

  FocusShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusShieldConfigurationExtension
    info:
      path: Sources/FocusShieldConfigurationExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.focushome.shield-configuration

  FocusDeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusDeviceActivityMonitorExtension
    info:
      path: Sources/FocusDeviceActivityMonitorExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.focushome.device-activity

