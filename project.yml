name: AttentionGuardRail
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages: {}
targets:
  AttentionGuardRail:
    type: application
    platform: iOS
    sources:
      - Sources/AttentionGuardRailApp
    entitlements:
      path: Sources/AttentionGuardRailApp/AttentionGuardRail.entitlements
    info:
      path: Sources/AttentionGuardRailApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail
    dependencies:
      - target: AttentionGuardRailWidgets
      - target: FocusShieldActionExtension
      - target: FocusShieldConfigurationExtension
      - target: FocusDeviceActivityMonitorExtension

  AttentionGuardRailWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/AttentionGuardRailWidgets
    entitlements:
      path: Sources/AttentionGuardRailWidgets/AttentionGuardRailWidgets.entitlements
    info:
      path: Sources/AttentionGuardRailWidgets/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.widgets

  FocusShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusShieldActionExtension
    info:
      path: Sources/FocusShieldActionExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.shield-action

  FocusShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusShieldConfigurationExtension
    info:
      path: Sources/FocusShieldConfigurationExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.shield-configuration

  FocusDeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusDeviceActivityMonitorExtension
    info:
      path: Sources/FocusDeviceActivityMonitorExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.device-activity

