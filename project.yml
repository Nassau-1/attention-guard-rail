name: AttentionGuardRail
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages: {}
targets:
  AttentionGuardRail:
    type: application
    platform: iOS
    sources:
      - Sources/AttentionGuardRailApp
    dependencies:
      - target: AttentionGuardRailWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: AttentionGuardRail
        PRODUCT_MODULE_NAME: AttentionGuardRail
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail
        INFOPLIST_FILE: Sources/AttentionGuardRailApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/AttentionGuardRailApp/AttentionGuardRail.entitlements

  AttentionGuardRailWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/AttentionGuardRailWidgets
    settings:
      base:
        PRODUCT_NAME: AttentionGuardRailWidgets
        PRODUCT_MODULE_NAME: AttentionGuardRailWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.widgets
        INFOPLIST_FILE: Sources/AttentionGuardRailWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/AttentionGuardRailWidgets/AttentionGuardRailWidgets.entitlements

  FocusShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusShieldActionExtension
    settings:
      base:
        PRODUCT_NAME: FocusShieldActionExtension
        PRODUCT_MODULE_NAME: FocusShieldActionExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.shield-action
        INFOPLIST_FILE: Sources/FocusShieldActionExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FocusShieldActionExtension/FocusShieldActionExtension.entitlements

  FocusShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusShieldConfigurationExtension
    settings:
      base:
        PRODUCT_NAME: FocusShieldConfigurationExtension
        PRODUCT_MODULE_NAME: FocusShieldConfigurationExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.shield-configuration
        INFOPLIST_FILE: Sources/FocusShieldConfigurationExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FocusShieldConfigurationExtension/FocusShieldConfigurationExtension.entitlements

  FocusDeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/FocusDeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_NAME: FocusDeviceActivityMonitorExtension
        PRODUCT_MODULE_NAME: FocusDeviceActivityMonitorExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.enzoterrier.attentionguardrail.device-activity
        INFOPLIST_FILE: Sources/FocusDeviceActivityMonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FocusDeviceActivityMonitorExtension/FocusDeviceActivityMonitorExtension.entitlements
